<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#d8017c">
<title>LAROVA · Marketing y comunicación</title>
<link rel="icon" type="image/png" href="./icon-192.png">
<!--
  LAROVA — Marketing y comunicación (BORRADOR 18-nov-2026, va en la raíz del repo ERP junto a larova.html).
  Página aparte: no cambia index.html ni nada de lo que ya funciona.
  Usa la misma sesión del ERP (mismo dominio) y lee solo la tabla nueva public.mkt_piezas,
  que la base deja ver únicamente a las administradoras.
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root{--rosa:#d8017c;--rosa-suave:#f9ddf4;--tinte:#fdf0f9;--hueso:#efebeb;--texto:#3a2c35;--suave:#6f5c66;--borde:#ead7e3;
    --crochet:#E74E96;--crochet-fondo:#FBE4EF;--academy:#1F6FDB;--academy-fondo:#E8F1FF;
    --idea:#9aa0a6;--aprobado:#0f8b8d;--grabado:#7a3fd6;--editado:#e0a032;--publicado:#2e8b57}
  *{box-sizing:border-box;margin:0}
  body{font-family:'Poppins',system-ui,sans-serif;background:linear-gradient(180deg,var(--tinte),var(--hueso));background-attachment:fixed;color:var(--texto);min-height:100vh;font-size:14px}
  .env{max-width:1100px;margin:0 auto;padding:18px 16px 48px}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header img{width:44px;height:44px;border-radius:12px}
  h1{font-size:22px;color:var(--rosa);font-weight:700}
  .volver{margin-left:auto;color:var(--rosa);font-weight:600;text-decoration:none;background:#fff;border-radius:999px;padding:7px 14px}
  .barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0}
  select,input,textarea,button{font:inherit;color:inherit}
  select,input,textarea{border:1px solid var(--borde);border-radius:10px;padding:8px 10px;background:#fff;min-width:0}
  button{border:0;border-radius:999px;padding:8px 14px;cursor:pointer;background:#fff;font-weight:600}
  button.prim{background:var(--rosa);color:#fff}
  .vistas button[aria-pressed=true]{background:var(--rosa);color:#fff}
  .esp{flex:1}
  .aviso{background:#fff;border-radius:16px;padding:18px;margin-top:20px;text-align:center}
  .lista{display:grid;gap:10px}
  .pieza{background:#fff;border-radius:16px;padding:14px;border-left:6px solid var(--m,var(--idea));cursor:pointer;display:grid;gap:4px}
  .pieza h3{font-size:15px}
  .meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--suave)}
  .chip{border-radius:999px;padding:2px 9px;background:var(--rosa-suave);color:var(--texto);font-size:12px;white-space:nowrap}
  .chip.est{background:var(--c);color:#fff}
  .chip.marca{background:var(--mf);color:var(--texto);font-weight:600}
  .leyenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--suave);margin:-6px 0 12px}
  .leyenda span.sin::before{display:none}
  .leyenda span::before{content:'';display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--m);margin-right:5px;vertical-align:-2px}
  .dia-grupo{font-weight:700;margin:10px 0 0;color:var(--suave);font-size:13px}
  .cal-cab{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .cal-cab h2{font-size:17px;flex:1;text-align:center;text-transform:capitalize}
  .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
  .cal .ds{font-size:11px;text-align:center;color:var(--suave);font-weight:600}
  .celda{background:#fff;border-radius:10px;min-height:92px;padding:4px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
  .celda.fuera{opacity:.45}
  .celda.hoy{outline:2px solid var(--rosa)}
  .celda .n{font-size:11px;font-weight:700}
  .mini{font-size:11px;line-height:1.2;border-radius:6px;padding:2px 4px 2px 5px;background:var(--mf);color:var(--texto);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;border-left:4px solid var(--m);text-align:left;font-weight:500}
  .mini::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:4px;vertical-align:1px}
  .sin-fecha{margin-top:14px}
  dialog{margin:auto;border:0;border-radius:18px;padding:0;width:min(720px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
  dialog::backdrop{background:rgba(58,44,53,.45)}
  .dlg{padding:18px;display:grid;gap:10px}
  .dlg h2{font-size:18px;color:var(--rosa)}
  .fila{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--suave)}
  textarea{min-height:110px;resize:vertical;font-size:14px;font-weight:400;color:var(--texto)}
  .plats{display:flex;flex-wrap:wrap;gap:10px;font-weight:400;color:var(--texto);font-size:14px}
  .plats label{display:flex;gap:5px;align-items:center;font-size:14px;color:var(--texto);font-weight:400}
  .acciones{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
  .acciones .borrar{background:#fde8e8;color:#a32020;margin-right:auto}
  .error{color:#a32020;font-size:13px}
  @media(max-width:640px){
    .fila{grid-template-columns:1fr}
    .celda{min-height:60px}
    .mini{font-size:0;height:9px;padding:0;background:var(--m);border-left:0}
    .mini::before{display:none}
    h1{font-size:19px}
  }
</style>
</head>
<body>
<div class="env">
  <header>
    <img src="./icon-192.png" alt="" width="44" height="44">
    <h1>Marketing y comunicación</h1>
    <a class="volver" href="./larova.html#administracion">← LAROVA</a>
  </header>

  <div id="bloqueo" class="aviso" hidden></div>

  <div id="app" hidden>
    <div class="barra">
      <div class="vistas" role="group" aria-label="Vista">
        <button type="button" data-vista="lista" aria-pressed="true">Lista</button>
        <button type="button" data-vista="calendario" aria-pressed="false">Calendario</button>
      </div>
      <select id="f-marca" aria-label="Marca"><option value="">Todas las marcas</option></select>
      <select id="f-plat" aria-label="Plataforma"><option value="">Todas las plataformas</option></select>
      <select id="f-estado" aria-label="Estado"><option value="">Todos los estados</option></select>
      <span class="esp"></span>
      <button type="button" class="prim" id="nueva">+ Nueva pieza</button>
    </div>
    <p class="leyenda" aria-hidden="true"><span style="--m:var(--crochet)">Lana Rosa Crochet</span><span style="--m:var(--academy)">Lana Rosa Academy</span><span class="sin">· la etiqueta y el punto de color = estado</span></p>
    <div id="v-lista"></div>
    <div id="v-calendario" hidden></div>
  </div>
</div>

<dialog id="dlg">
  <form class="dlg" id="form" method="dialog">
    <h2 id="dlg-titulo">Pieza</h2>
    <label>Ángulo (la idea de la pieza en una frase) <input name="angulo" required maxlength="300"></label>
    <div class="fila">
      <label>Marca <select name="marca" required></select></label>
      <label>Tipo de publicación <select name="tipo" required></select></label>
    </div>
    <div class="fila">
      <label>Estado <select name="estado" required></select></label>
      <label>Fecha de publicación <input type="date" name="fecha"></label>
    </div>
    <label>Dónde se publica <span class="plats" id="plats"></span></label>
    <label>Objetivo <span class="plats" id="objs"></span></label>
    <label>Guion completo <textarea name="guion" placeholder="Gancho, tomas, frases y cierre"></textarea></label>
    <label>Copy (texto de la publicación) <textarea name="copy" placeholder="Texto, llamado a la acción y hashtags"></textarea></label>
    <label>Sábado de grabación en bloque <input type="date" name="bloque"></label>
    <label>Notas (datos pendientes: fotos, permisos) <textarea name="notas" style="min-height:60px"></textarea></label>
    <p class="error" id="dlg-error" hidden></p>
    <div class="acciones">
      <button type="button" class="borrar" id="borrar" hidden>Borrar</button>
      <button type="button" id="cancelar">Cancelar</button>
      <button type="submit" class="prim" id="guardar">Guardar</button>
    </div>
  </form>
</dialog>

<script>
(function () {
  'use strict';
  var SUPABASE_URL = 'https://ngjoognzvehwjtpqwrqe.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5nam9vZ256dmVod2p0cHF3cnFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3MDAzMDYsImV4cCI6MjA5NzI3NjMwNn0.2BNYuaQOTh-lU8GZcYhJAnZPBiJvT5PwB9MYZwNHTUE';
  var TABLA = 'mkt_piezas';

  var MARCAS = { crochet: 'Lana Rosa Crochet', academy: 'Lana Rosa Academy' };
  var TIPOS = { reel: 'Reel', carrusel: 'Carrusel', stories: 'Stories', video_youtube: 'Video de YouTube', foto: 'Foto' };
  var PLATS = { instagram: 'Instagram', facebook: 'Facebook', tiktok: 'TikTok', pinterest: 'Pinterest', youtube: 'YouTube' };
  var OBJS = { alcance: 'Alcance', confianza: 'Confianza', conversion: 'Conversión', formacion: 'Formación', lista_espera: 'Lista de espera', comunidad: 'Comunidad' };
  var ESTADOS = { idea: 'Idea', aprobado: 'Aprobado', grabado: 'Grabado', editado: 'Editado', publicado: 'Publicado' };

  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  var piezas = [];
  var vista = 'lista';
  var mes = new Date(); mes.setDate(1);
  var editando = null;

  var $ = function (s) { return document.querySelector(s); };
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function opciones(sel, mapa, conVacia) {
    Object.keys(mapa).forEach(function (k) { var o = document.createElement('option'); o.value = k; o.textContent = mapa[k]; sel.appendChild(o); });
  }
  function colorEstado(e) { return 'var(--' + (ESTADOS[e] ? e : 'idea') + ')'; }
  function colores(x) {
    var m = MARCAS[x.marca] ? x.marca : 'crochet';
    return '--c:' + colorEstado(x.estado) + ';--m:var(--' + m + ');--mf:var(--' + m + '-fondo)';
  }
  function aFecha(d) { var p = String(d).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function fechaLarga(d) {
    if (!d) return 'Sin fecha';
    return aFecha(d).toLocaleDateString('es-CO', { weekday: 'short', day: 'numeric', month: 'short' });
  }
  function claveDia(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function bloquear(html) { $('#app').hidden = true; var b = $('#bloqueo'); b.hidden = false; b.innerHTML = html; }

  function filtradas() {
    var m = $('#f-marca').value, p = $('#f-plat').value, e = $('#f-estado').value;
    return piezas.filter(function (x) {
      return (!m || x.marca === m) && (!e || x.estado === e) && (!p || (x.plataformas || []).indexOf(p) >= 0);
    });
  }

  function tarjeta(x) {
    var plats = (x.plataformas || []).map(function (p) { return '<span class="chip">' + esc(PLATS[p] || p) + '</span>'; }).join('');
    var objs = (x.objetivos || []).map(function (o) { return OBJS[o] || o; }).join(' · ');
    return '<article class="pieza" tabindex="0" data-id="' + esc(x.id) + '" style="' + colores(x) + '">' +
      '<h3>' + esc(x.angulo) + '</h3>' +
      '<div class="meta"><span class="chip est">' + esc(ESTADOS[x.estado] || x.estado) + '</span>' +
      '<span class="chip">' + esc(TIPOS[x.tipo_publicacion] || x.tipo_publicacion) + '</span>' + plats +
      '<span class="chip marca">' + esc(MARCAS[x.marca] || x.marca) + '</span><span>' + esc(fechaLarga(x.fecha)) + '</span>' +
      (objs ? '<span>· ' + esc(objs) + '</span>' : '') + '</div>' +
      '</article>';
  }

  function pintarLista(lista) {
    if (!lista.length) { $('#v-lista').innerHTML = '<p class="aviso">No hay piezas con estos filtros.</p>'; return; }
    var html = '<div class="lista">', ultimo = null;
    lista.forEach(function (x) {
      var g = x.fecha ? aFecha(x.fecha).toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long' }) : 'Sin fecha';
      if (g !== ultimo) { html += '<p class="dia-grupo">' + esc(g) + '</p>'; ultimo = g; }
      html += tarjeta(x);
    });
    $('#v-lista').innerHTML = html + '</div>';
  }

  function pintarCalendario(lista) {
    var porDia = {};
    var sinFecha = [];
    lista.forEach(function (x) {
      if (!x.fecha) { sinFecha.push(x); return; }
      var k = x.fecha; (porDia[k] = porDia[k] || []).push(x);
    });
    var ini = new Date(mes); var dSem = (ini.getDay() + 6) % 7; ini.setDate(ini.getDate() - dSem);
    var hoy = claveDia(new Date());
    var html = '<div class="cal-cab"><button type="button" id="mes-ant" aria-label="Mes anterior">‹</button><h2>' +
      esc(mes.toLocaleDateString('es-CO', { month: 'long' }) + ' ' + mes.getFullYear()) +
      '</h2><button type="button" id="mes-sig" aria-label="Mes siguiente">›</button></div><div class="cal">';
    ['lun', 'mar', 'mié', 'jue', 'vie', 'sáb', 'dom'].forEach(function (d) { html += '<div class="ds">' + d + '</div>'; });
    for (var i = 0; i < 42; i++) {
      var d = new Date(ini); d.setDate(ini.getDate() + i);
      var k = claveDia(d);
      html += '<div class="celda' + (d.getMonth() !== mes.getMonth() ? ' fuera' : '') + (k === hoy ? ' hoy' : '') + '"><span class="n">' + d.getDate() + '</span>';
      (porDia[k] || []).forEach(function (x) {
        html += '<button type="button" class="mini" data-id="' + esc(x.id) + '" style="' + colores(x) + '" title="' + esc((MARCAS[x.marca] || '') + ' · ' + (ESTADOS[x.estado] || '') + ' · ' + x.angulo) + '">' + esc((TIPOS[x.tipo_publicacion] || '').charAt(0) + ' · ' + x.angulo) + '</button>';
      });
      html += '</div>';
      if (i === 34 && d.getMonth() !== mes.getMonth()) break;
    }
    html += '</div>';
    if (sinFecha.length) html += '<div class="sin-fecha"><p class="dia-grupo">Sin fecha todavía</p><div class="lista">' + sinFecha.map(tarjeta).join('') + '</div></div>';
    $('#v-calendario').innerHTML = html;
    $('#mes-ant').onclick = function () { mes.setMonth(mes.getMonth() - 1); pintar(); };
    $('#mes-sig').onclick = function () { mes.setMonth(mes.getMonth() + 1); pintar(); };
  }

  function pintar() {
    var lista = filtradas();
    $('#v-lista').hidden = vista !== 'lista';
    $('#v-calendario').hidden = vista !== 'calendario';
    if (vista === 'lista') pintarLista(lista); else pintarCalendario(lista);
  }

  function abrir(x) {
    editando = x || null;
    var f = $('#form');
    f.reset();
    $('#dlg-error').hidden = true;
    $('#dlg-titulo').textContent = x ? 'Editar pieza' : 'Nueva pieza';
    $('#borrar').hidden = !x;
    x = x || { marca: $('#f-marca').value || 'crochet', tipo_publicacion: 'reel', estado: 'idea', plataformas: ['instagram'], objetivos: [] };
    f.angulo.value = x.angulo || '';
    f.marca.value = x.marca; f.tipo.value = x.tipo_publicacion; f.estado.value = x.estado;
    f.fecha.value = x.fecha || ''; f.bloque.value = x.bloque_grabacion || '';
    f.guion.value = x.guion || ''; f.copy.value = x.copy || ''; f.notas.value = x.notas || '';
    document.querySelectorAll('#plats input').forEach(function (c) { c.checked = (x.plataformas || []).indexOf(c.value) >= 0; });
    document.querySelectorAll('#objs input').forEach(function (c) { c.checked = (x.objetivos || []).indexOf(c.value) >= 0; });
    $('#dlg').showModal();
  }

  async function guardar(ev) {
    ev.preventDefault();
    var f = $('#form');
    var fila = {
      angulo: f.angulo.value.trim(), marca: f.marca.value, tipo_publicacion: f.tipo.value, estado: f.estado.value,
      fecha: f.fecha.value || null, bloque_grabacion: f.bloque.value || null,
      plataformas: marcadas('#plats'), objetivos: marcadas('#objs'),
      guion: f.guion.value, copy: f.copy.value, notas: f.notas.value,
      actualizado_en: new Date().toISOString()
    };
    if (!fila.angulo) return;
    if (fila.estado === 'publicado' && !fila.fecha) { mostrarError('Una pieza publicada necesita su fecha.'); return; }
    $('#guardar').disabled = true;
    var r = editando ? await sb.from(TABLA).update(fila).eq('id', editando.id).select().single()
                     : await sb.from(TABLA).insert(fila).select().single();
    $('#guardar').disabled = false;
    if (r.error) { mostrarError('No se pudo guardar: ' + r.error.message); return; }
    $('#dlg').close();
    await cargar();
  }
  function marcadas(sel) { return Array.prototype.map.call(document.querySelectorAll(sel + ' input:checked'), function (c) { return c.value; }); }
  function mostrarError(t) { var e = $('#dlg-error'); e.textContent = t; e.hidden = false; }

  async function borrar() {
    if (!editando || !confirm('¿Borrar la pieza «' + editando.angulo + '»? No se puede deshacer.')) return;
    var r = await sb.from(TABLA).delete().eq('id', editando.id);
    if (r.error) { mostrarError('No se pudo borrar: ' + r.error.message); return; }
    $('#dlg').close();
    await cargar();
  }

  async function cargar() {
    var r = await sb.from(TABLA).select('*').order('fecha', { ascending: true, nullsFirst: false }).order('creado_en');
    if (r.error) { bloquear('No se pudieron cargar las piezas: ' + esc(r.error.message)); return; }
    piezas = r.data || [];
    pintar();
  }

  async function iniciar() {
    opciones($('#f-marca'), MARCAS); opciones($('#f-plat'), PLATS); opciones($('#f-estado'), ESTADOS);
    var f = $('#form');
    opciones(f.marca, MARCAS); opciones(f.tipo, TIPOS); opciones(f.estado, ESTADOS);
    function casillas(mapa) { return Object.keys(mapa).map(function (k) { return '<label><input type="checkbox" value="' + k + '"> ' + mapa[k] + '</label>'; }).join(''); }
    $('#plats').innerHTML = casillas(PLATS); $('#objs').innerHTML = casillas(OBJS);

    var s = await sb.auth.getSession();
    if (!s.data || !s.data.session) {
      bloquear('Para ver Marketing, entra primero al ERP con tu cuenta. <br><br><a class="volver" href="./index.html">Ir al ERP</a>');
      return;
    }
    var rol = await sb.rpc('fn_rol_actual');
    if (rol.error || rol.data !== 'administrador') {
      bloquear('Marketing y comunicación es solo para administradoras.');
      return;
    }
    $('#app').hidden = false;

    document.querySelectorAll('.vistas button').forEach(function (b) {
      b.onclick = function () {
        vista = b.dataset.vista;
        document.querySelectorAll('.vistas button').forEach(function (o) { o.setAttribute('aria-pressed', String(o === b)); });
        pintar();
      };
    });
    ['#f-marca', '#f-plat', '#f-estado'].forEach(function (s) { $(s).onchange = pintar; });
    $('#nueva').onclick = function () { abrir(null); };
    $('#cancelar').onclick = function () { $('#dlg').close(); };
    $('#borrar').onclick = borrar;
    f.addEventListener('submit', guardar);
    document.addEventListener('click', function (e) {
      var el = e.target.closest('[data-id]');
      if (el && !$('#dlg').open) abrir(piezas.find(function (x) { return x.id === el.dataset.id; }));
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('pieza')) e.target.click();
    });
    await cargar();
  }

  iniciar();
})();
</script>
</body>
</html>
