<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#d8017c">
<title>LAROVA · Gestión Colaboradores</title>
<link rel="icon" type="image/png" href="./icon-192.png">
<!-- Gestión Colaboradores · Fase 1 · MURO. Página aparte (como marketing.html): misma sesión del ERP, no cambia index.html.
     Lee y escribe solo con las funciones gestion_colab_* y las tablas gestion_colab_publicaciones / _lecturas. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root{--rosa:#d8017c;--tinte:#fdf0f9;--hueso:#efebeb;--texto:#3a2c35;--suave:#6f5c66;--borde:#ead7e3;--fondo-tarjeta:#fff}
  *{box-sizing:border-box;margin:0}
  body{font-family:'Poppins',system-ui,sans-serif;background:linear-gradient(180deg,var(--tinte),var(--hueso));background-attachment:fixed;color:var(--texto);min-height:100vh;font-size:15px}
  .env{max-width:720px;margin:0 auto;padding:18px 16px 48px}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header img{width:44px;height:44px;border-radius:12px}
  h1{font-size:21px;color:var(--rosa);font-weight:700}
  .volver{margin-left:auto;color:var(--rosa);font-weight:600;text-decoration:none;background:#fff;border-radius:999px;padding:7px 14px}
  .sub{color:var(--suave);margin:6px 0 16px;font-size:13px}
  textarea,select,button{font:inherit;color:inherit}
  textarea,select{width:100%;border:1px solid var(--borde);border-radius:12px;padding:10px 12px;background:#fff}
  textarea{min-height:84px;resize:vertical}
  button{cursor:pointer;border:0;border-radius:999px;background:var(--rosa);color:#fff;font-weight:600;padding:9px 18px}
  button.suave{background:#fff;color:var(--rosa);border:1px solid var(--borde);padding:5px 12px;font-size:12px}
  .nuevo{background:var(--fondo-tarjeta);border-radius:16px;padding:14px;margin-bottom:18px;box-shadow:0 1px 6px #d8017c14}
  .fila{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .fila label{font-size:13px;color:var(--suave)}
  .fila select{width:auto}
  .pub{background:var(--fondo-tarjeta);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 6px #d8017c14}
  .pub.fijada{border:2px solid var(--rosa)}
  .pub.nueva{border-left:5px solid var(--rosa)}
  .meta{font-size:12px;color:var(--suave);margin-bottom:6px;display:flex;gap:8px;flex-wrap:wrap}
  .texto{white-space:pre-wrap;word-wrap:break-word}
  .acciones{display:flex;gap:6px;margin-top:10px}
  .msg{padding:30px 16px;text-align:center;color:var(--suave)}
  .etiqueta{background:var(--tinte);border-radius:999px;padding:1px 9px;color:var(--rosa);font-weight:600}
  .h2{font-size:16px;color:var(--rosa);margin:14px 0 8px}
  .tarea{display:flex;gap:10px;align-items:flex-start;background:var(--fondo-tarjeta);border-radius:14px;padding:11px 13px;margin-bottom:8px}
  .tarea input{margin-top:4px;width:18px;height:18px;accent-color:var(--rosa)}
  .tarea.hecha .tt{text-decoration:line-through;color:var(--suave)}
  .tarea .de{font-size:12px;color:var(--suave)}
  .chip{border-radius:999px;padding:3px 11px;font-size:12px;font-weight:600}
  .a-critica{background:#fde2e2;color:#a12d2d}.a-preventiva{background:#fff3d6;color:#8a5a00}.a-informativa{background:#dce8f5;color:#2d5a8c}.a-cumplida{background:#e3f1e6;color:#2e6b3a}
  .cumP{margin:12px 0 4px;font-weight:700}
  .req{background:var(--fondo-tarjeta);border-radius:14px;padding:10px 13px;margin-bottom:8px}
  .req .fila{margin-top:6px}.req input[type=date]{border:1px solid var(--borde);border-radius:10px;padding:6px 8px}
  details.bloque{background:var(--fondo-tarjeta);border-radius:16px;padding:12px 14px;margin:10px 0;box-shadow:0 1px 6px #d8017c14}
  details.bloque summary{cursor:pointer;font-weight:700;color:var(--rosa)}
  .cont{margin-top:10px}.cont h3{font-size:14px;margin-bottom:2px}.cont p{white-space:pre-wrap;margin-bottom:10px}
  .orgA{font-weight:700;margin:12px 0 4px;color:var(--rosa)}.orgP{padding:6px 0;border-bottom:1px solid var(--borde)}.vac{color:var(--suave);font-style:italic}
  .rec{padding:8px 0;border-bottom:1px solid var(--borde)}
  #menu{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .item{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:#fff;color:var(--texto);border:1px solid var(--borde);border-radius:14px;padding:15px 16px;font-size:16px;font-weight:600;box-shadow:0 1px 6px #d8017c14}
  .item span{color:var(--rosa);font-size:20px}
  .atras{margin-bottom:6px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="env">
  <header><img src="./icon-192.png" alt=""><h1>Gestión Colaboradores</h1><a class="volver" href="./larova.html#equipo">‹ Volver</a></header>
  <p class="sub">Elige una sección.</p>
  <div id="aviso" class="msg">Cargando…</div>
  <div id="app" hidden>
    <nav id="menu">
      <button class="item" data-ir="ficha">👤 Mi ficha<span>›</span></button>
      <button class="item" data-ir="induccion">🌸 Conoce Lana Rosa<span>›</span></button>
      <button class="item" data-ir="muro">📣 Muro<span>›</span></button>
      <button class="item" data-ir="bienvenida">🧺 Mis tareas de bienvenida<span>›</span></button>
      <button class="item" data-ir="org">🧭 Organigrama<span>›</span></button>
      <button class="item" data-ir="rec">⭐ Reconocimientos<span>›</span></button>
      <button class="item" data-ir="cumplimiento" id="itemCump" hidden>✅ Centro de cumplimiento<span>›</span></button>
    </nav>
    <section class="vista" id="v-ficha" hidden><button class="suave atras" data-atras="1">‹ Volver a la lista</button><h2 class="h2">👤 Mi ficha</h2>

      <div class="fila" id="fichaAdmin" hidden><label>Ver la ficha de:</label><select id="fichaPersona"></select></div>
      <div class="fila" id="fichaTabs" style="margin-top:10px"><button class="suave" data-tab="resumen">Resumen</button><button class="suave" data-tab="datos">Mis datos</button><button class="suave" data-tab="docs">Documentos</button><button class="suave" data-tab="vac">Vacaciones</button></div>
      <div id="fichaCuerpo" class="cont"></div>
    </section>
    <section class="vista" id="v-induccion" hidden><button class="suave atras" data-atras="1">‹ Volver a la lista</button><h2 class="h2">🌸 Conoce Lana Rosa</h2>
<div id="induccion"></div>
    </section>
    <section class="vista" id="v-muro" hidden><button class="suave atras" data-atras="1">‹ Volver a la lista</button><h2 class="h2">📣 Muro</h2>
<div class="nuevo" id="nuevo" hidden>
      <textarea id="texto" maxlength="2000" placeholder="Escribe un aviso para el equipo…"></textarea>
      <div class="fila">
        <label><input type="checkbox" id="fijar"> 📌 Fijar arriba</label>
        <span style="flex:1"></span><button id="publicar">Publicar</button>
      </div>
      <p id="error" class="sub" style="color:#a12d2d" hidden></p>
    </div>
    <div id="lista"></div>

    </section>
    <section class="vista" id="v-bienvenida" hidden><button class="suave atras" data-atras="1">‹ Volver a la lista</button><h2 class="h2">🧺 Mis tareas de bienvenida</h2>
<p id="onbVacio" class="sub" hidden>Todavía no tienes tareas de bienvenida.</p>
      <section id="onb" hidden>
      
      <div id="onbLista"></div>
    </section>
<section id="onbAdmin" class="nuevo" hidden>
      <h2 class="h2">Bienvenida de una persona nueva</h2>
      <div class="fila"><select id="onbPersona"></select><button id="onbAsignar">Asignar tareas</button></div>
      <p id="onbMsg" class="sub"></p>
      <div id="onbResumen"></div>
    </section>
    </section>
    <section class="vista" id="v-org" hidden><button class="suave atras" data-atras="1">‹ Volver a la lista</button><h2 class="h2">🧭 Organigrama</h2>
<div id="org"></div>
      <div class="fila" id="orgAdmin" hidden><input id="vacCargo" placeholder="Cargo vacante" style="flex:1;border:1px solid var(--borde);border-radius:10px;padding:8px 10px"><input id="vacArea" placeholder="Área" style="width:120px;border:1px solid var(--borde);border-radius:10px;padding:8px 10px"><button id="vacAgregar" class="suave">Agregar vacante</button></div>
    </section>
    <section class="vista" id="v-rec" hidden><button class="suave atras" data-atras="1">‹ Volver a la lista</button><h2 class="h2">⭐ Reconocimientos</h2>

      <div class="nuevo" style="margin-top:10px"><div class="fila"><select id="recPara"></select><select id="recValor"></select></div>
        <textarea id="recMsg" maxlength="500" placeholder="Cuéntale por qué (gracias por…)" style="min-height:60px;margin-top:8px"></textarea>
        <div class="fila"><span style="flex:1"></span><button id="recEnviar">Reconocer</button></div><p id="recErr" class="sub" style="color:#a12d2d" hidden></p></div>
      <div id="recLista"></div>
    </section>
    <section class="vista" id="v-cumplimiento" hidden><button class="suave atras" data-atras="1">‹ Volver a la lista</button><h2 class="h2">✅ Centro de cumplimiento</h2>
<section id="cump">
      
      <div id="cumResumen" class="fila"></div>
      <label class="de" style="font-size:13px;color:var(--suave)"><input type="checkbox" id="cumTodo"> Mostrar también lo que está al día</label>
      <div id="cumLista"></div>
    </section>
    </section>
  </div>
</div>
<script>
(function () {
  var sb = window.supabase.createClient('https://ngjoognzvehwjtpqwrqe.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5nam9vZ256dmVod2p0cHF3cnFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3MDAzMDYsImV4cCI6MjA5NzI3NjMwNn0.2BNYuaQOTh-lU8GZcYhJAnZPBiJvT5PwB9MYZwNHTUE');
  var $ = function (s) { return document.querySelector(s); };
  var esAdmin = false, leidas = {};
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fecha(iso) { return new Date(iso).toLocaleString('es-CO', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }); }
  function destino(d) { return d === 'lideres' ? 'Solo líderes' : d === 'area' ? 'Mi área' : ''; }
  function aviso(t) { $('#aviso').hidden = false; $('#aviso').innerHTML = t; $('#app').hidden = true; }

  async function cargar() {
    var r = await sb.from('gestion_colab_publicaciones').select('*').order('fijada', { ascending: false }).order('creada_en', { ascending: false }).limit(50);
    var l = await sb.from('gestion_colab_lecturas').select('publicacion_id');
    leidas = {}; (l.data || []).forEach(function (x) { leidas[x.publicacion_id] = true; });
    if (r.error) { $('#lista').innerHTML = '<div class="msg">No se pudo cargar el muro. Intenta de nuevo.</div>'; return; }
    var datos = r.data || [];
    if (!datos.length) { $('#lista').innerHTML = '<div class="msg">Todavía no hay avisos.</div>'; return; }
    $('#lista').innerHTML = datos.map(function (p) {
      var nueva = !leidas[p.id];
      return '<article class="pub' + (p.fijada ? ' fijada' : '') + (nueva ? ' nueva' : '') + '" data-id="' + p.id + '">' +
        '<div class="meta">' + (p.fijada ? '<span>📌 Fijado</span>' : '') + '<strong>' + esc(p.autor_nombre || 'Lana Rosa') + '</strong><span>' + fecha(p.creada_en) + '</span>' +
        (destino(p.destino) ? '<span class="etiqueta">' + destino(p.destino) + '</span>' : '') + (nueva ? '<span class="etiqueta">Nuevo</span>' : '') + '</div>' +
        '<div class="texto">' + esc(p.texto) + '</div>' +
        (esAdmin ? '<div class="acciones"><button class="suave" data-fijar="' + (!p.fijada) + '">' + (p.fijada ? 'Quitar fijado' : '📌 Fijar') + '</button><button class="suave" data-borrar="1">Borrar</button></div>' : '') +
        '</article>';
    }).join('');
    datos.filter(function (p) { return !leidas[p.id]; }).forEach(function (p) { sb.rpc('gestion_colab_marcar_leida', { p_id: p.id }); });
  }

  async function cargarOnboarding() {
    var uid = (await sb.auth.getSession()).data.session.user.id;
    var r = await sb.from('gestion_colab_onboarding_tareas').select('*').order('vence_en');
    var todas = r.data || [], mias = todas.filter(function (t) { return t.user_id === uid; });
    $('#onb').hidden = !mias.length; $('#onbVacio').hidden = !!mias.length;
    $('#onbLista').innerHTML = mias.map(function (t) {
      var propia = t.responsable === 'colaboradora';
      return '<div class="tarea' + (t.estado === 'hecha' ? ' hecha' : '') + '"><input type="checkbox" data-tarea="' + t.id + '"' + (t.estado === 'hecha' ? ' checked' : '') + (propia ? '' : ' disabled') + '><div><div class="tt">' + esc(t.titulo) + '</div><div class="de">' + (propia ? 'Te toca a ti' : 'Lo hace la administración') + (t.vence_en ? ' · para el ' + fecha(t.vence_en + 'T12:00:00').split(',')[0] : '') + '</div></div></div>';
    }).join('');
    if (esAdmin) {
      var n = {}; todas.forEach(function (t) { n[t.user_id] = n[t.user_id] || { p: 0, h: 0 }; n[t.user_id][t.estado === 'hecha' ? 'h' : 'p']++; });
      var us = await sb.from('usuarios_roles').select('user_id,nombre_completo').eq('activo', true).order('nombre_completo');
      var nombres = {}; (us.data || []).forEach(function (u) { nombres[u.user_id] = u.nombre_completo; });
      $('#onbPersona').innerHTML = (us.data || []).map(function (u) { return '<option value="' + u.user_id + '">' + esc(u.nombre_completo || 'Sin nombre') + '</option>'; }).join('');
      $('#onbResumen').innerHTML = Object.keys(n).map(function (k) { return '<div class="tarea"><div><div class="tt">' + esc(nombres[k] || 'Persona') + '</div><div class="de">' + n[k].h + ' hechas · ' + n[k].p + ' por hacer</div></div></div>'; }).join('');
    }
  }

  var ESTADOS = { pendiente: 'Pendiente', en_preparacion: 'En preparación', pendiente_firma: 'Pendiente de firma', pendiente_revision: 'Pendiente de revisión', vigente: 'Vigente', vencido: 'Vencido', no_aplica: 'No aplica', archivado: 'Archivado' };
  var ALERTAS = { critica: 'Crítica', preventiva: 'Preventiva', informativa: 'Informativa', cumplida: 'Cumplida' };
  var filasCump = [];
  function pintarCumplimiento() {
    var todo = $('#cumTodo').checked, cuenta = { critica: 0, preventiva: 0, informativa: 0, cumplida: 0 };
    filasCump.forEach(function (f) { cuenta[f.alerta]++; });
    $('#cumResumen').innerHTML = Object.keys(ALERTAS).map(function (k) { return '<span class="chip a-' + k + '">' + ALERTAS[k] + ': ' + cuenta[k] + '</span>'; }).join('');
    var ver = filasCump.filter(function (f) { return todo || f.alerta !== 'cumplida'; }), html = '', ultima = '';
    ver.forEach(function (f) {
      if (f.empleado !== ultima) { html += '<div class="cumP">' + esc(f.empleado) + '</div>'; ultima = f.empleado; }
      html += '<div class="req" data-req="' + f.requisito_id + '" data-emp="' + f.empleado_id + '"><div><strong>' + esc(f.requisito) + '</strong> <span class="chip a-' + f.alerta + '">' + ALERTAS[f.alerta] + '</span></div><div class="sub" style="margin:2px 0 0">' + esc(f.categoria) + ' · ' + esc(f.mensaje) + '</div>' +
        (esAdmin ? '<div class="fila"><select data-e>' + Object.keys(ESTADOS).map(function (k) { return '<option value="' + k + '"' + (k === f.estado ? ' selected' : '') + '>' + ESTADOS[k] + '</option>'; }).join('') + '</select><input type="date" data-v value="' + (f.vence_en || '') + '"><button class="suave" data-guardar="1">Guardar</button></div>' : '') + '</div>';
    });
    $('#cumLista').innerHTML = html || '<div class="msg">Todo está al día 🌸</div>';
  }
  async function cargarCumplimiento() {
    var r = await sb.rpc('gestion_colab_cumplimiento');
    if (r.error) { $('#cumLista').innerHTML = '<div class="msg">No se pudo cargar el cumplimiento.</div>'; return; }
    filasCump = r.data || []; pintarCumplimiento();
  }

  async function cargarInduccion() {
    var r = await sb.from('gestion_colab_contenidos').select('*').order('orden');
    $('#induccion').innerHTML = (r.data || []).map(function (c) { return '<div class="cont"><h3>' + esc(c.titulo) + (c.borrador ? ' <span class="etiqueta">Borrador</span>' : '') + '</h3><p>' + esc(c.texto) + '</p>' + (esAdmin ? '<button class="suave" data-edit="' + c.slug + '">Editar</button>' : '') + '</div>'; }).join('');
    window.__cont = r.data || [];
  }
  async function cargarOrg() {
    var r = await sb.rpc('gestion_colab_organigrama'), d = r.data || [], html = '', area = null;
    d.forEach(function (p) {
      if (p.area !== area) { area = p.area; html += '<div class="orgA">' + esc(area || 'Sin área') + '</div>'; }
      html += '<div class="orgP">' + (p.vacante ? '<span class="vac">Vacante: ' + esc(p.cargo) + '</span>' + (esAdmin ? ' <button class="suave" data-cerrar="' + p.vacante_id + '">Cerrar</button>' : '') : '<strong>' + esc(p.nombre) + '</strong>' + (p.es_lider ? ' ⭐' : '') + '<div class="sub" style="margin:0">' + esc(p.cargo || 'Sin cargo') + '</div>') + '</div>';
    });
    $('#org').innerHTML = html || '<div class="msg">Aún no hay fichas.</div>';
  }
  async function cargarRec() {
    var l = await sb.rpc('gestion_colab_reconocimientos_lista');
    $('#recLista').innerHTML = (l.data || []).map(function (x) { return '<div class="rec">' + esc(x.emoji) + ' <strong>' + esc(x.para_nombre || 'Alguien') + '</strong> · ' + esc(x.valor) + '<div class="sub" style="margin:2px 0">«' + esc(x.mensaje) + '» — ' + esc(x.de_nombre || 'Una compañera') + ', ' + fecha(x.creada_en) + '</div></div>'; }).join('') || '<div class="msg">Sé la primera en reconocer a una compañera 🌸</div>';
  }
  async function prepararRec() {
    var c = await sb.rpc('gestion_colab_companeras'), v = await sb.from('gestion_colab_valores').select('*').order('orden');
    $('#recPara').innerHTML = (c.data || []).map(function (u) { return '<option value="' + u.user_id + '">' + esc(u.nombre) + '</option>'; }).join('');
    $('#recValor').innerHTML = (v.data || []).map(function (x) { return '<option value="' + x.id + '">' + esc(x.emoji + ' ' + x.nombre) + '</option>'; }).join('');
    cargarRec();
  }

  var CLAVES = { contacto_emergencia_nombre: 'Contacto de emergencia (nombre)', contacto_emergencia_telefono: 'Contacto de emergencia (teléfono)', talla_camisa: 'Talla de camisa (dotación)', talla_calzado: 'Talla de calzado (dotación)' };
  var fichaUser = null, fichaTab = 'resumen';
  function dia(d) { return d ? new Date(d + 'T12:00:00').toLocaleDateString('es-CO', { day: 'numeric', month: 'long', year: 'numeric' }) : '—'; }
  async function pintarFicha() {
    var el = $('#fichaCuerpo'); el.innerHTML = 'Cargando…';
    document.querySelectorAll('#fichaTabs [data-tab]').forEach(function (b) { b.style.background = b.dataset.tab === fichaTab ? 'var(--tinte)' : '#fff'; });
    var uid = fichaUser;
    if (fichaTab === 'resumen') {
      var r = await sb.rpc('gestion_colab_mi_ficha', { p_user: uid }), f = (r.data || [])[0];
      el.innerHTML = f ? '<h3>' + esc(f.nombre) + '</h3><p>Cargo: ' + esc(f.cargo || '—') + '\nÁrea: ' + esc(f.area || '—') + '\nJornada: ' + esc(f.jornada || '—') + '\nIngreso: ' + dia(f.fecha_ingreso) + '\nContrato: ' + esc(f.tipo_contrato || '—') + (f.fecha_fin_contrato ? ' hasta ' + dia(f.fecha_fin_contrato) : '') + '</p>' : '<div class="msg">Todavía no hay una ficha de empleada conectada a esta cuenta.</div>';
    } else if (fichaTab === 'datos') {
      var a = await sb.from('gestion_colab_atributos').select('clave,valor').eq('user_id', uid), m = {};
      (a.data || []).forEach(function (x) { m[x.clave] = x.valor; });
      el.innerHTML = Object.keys(CLAVES).map(function (k) { return '<label class="sub" style="display:block;margin:8px 0 2px">' + CLAVES[k] + '</label><div class="fila" style="margin:0"><input data-attr="' + k + '" value="' + esc(m[k] || '') + '" maxlength="120" style="flex:1;border:1px solid var(--borde);border-radius:10px;padding:8px 10px"><button class="suave" data-guardar-attr="' + k + '">Guardar</button></div>'; }).join('') + '<p class="sub">Solo tú y la administración ven estos datos.</p>';
    } else if (fichaTab === 'docs') {
      el.innerHTML = '<div class="msg">Aquí aparecerán tus documentos cuando se active la carpeta. Por ahora la administración los guarda en la ficha del ERP.</div>';
    } else {
      el.innerHTML = '<p>Tus vacaciones y permisos se piden en el ERP: <a href="./index.html">Ir a Mi perfil → Vacaciones y permisos</a>.</p>';
    }
  }
  async function prepararFicha() {
    fichaUser = (await sb.auth.getSession()).data.session.user.id;
    if (esAdmin) {
      var us = await sb.from('usuarios_roles').select('user_id,nombre_completo').eq('activo', true).order('nombre_completo');
      $('#fichaPersona').innerHTML = '<option value="' + fichaUser + '">Yo</option>' + (us.data || []).filter(function (u) { return u.user_id !== fichaUser; }).map(function (u) { return '<option value="' + u.user_id + '">' + esc(u.nombre_completo || 'Sin nombre') + '</option>'; }).join('');
      $('#fichaAdmin').hidden = false;
      $('#fichaPersona').onchange = function () { fichaUser = this.value; pintarFicha(); };
    }
    $('#fichaTabs').onclick = function (e) { if (e.target.dataset.tab) { fichaTab = e.target.dataset.tab; pintarFicha(); } };
    $('#fichaCuerpo').onclick = async function (e) {
      var k = e.target.dataset.guardarAttr; if (!k) return;
      var v = document.querySelector('[data-attr="' + k + '"]').value;
      var r = await sb.rpc('gestion_colab_atributo_set', { p_user: fichaUser, p_clave: k, p_valor: v });
      e.target.textContent = r.error ? 'Error' : 'Guardado ✓'; if (r.error) alert(r.error.message);
    };
  }

  function ir(v) {
    $('#menu').hidden = true; document.querySelectorAll('.vista').forEach(function (x) { x.hidden = x.id !== 'v-' + v; });
    if (v === 'ficha') pintarFicha(); window.scrollTo(0, 0);
  }
  function volverLista() { document.querySelectorAll('.vista').forEach(function (x) { x.hidden = true; }); $('#menu').hidden = false; window.scrollTo(0, 0); }

  async function iniciar() {
    var s = await sb.auth.getSession();
    if (!s.data || !s.data.session) { aviso('Para ver el muro, entra primero al ERP con tu cuenta.<br><br><a class="volver" href="./index.html">Ir al ERP</a>'); return; }
    var ok = await sb.rpc('gestion_colab_es_colaborador');
    if (ok.error || ok.data !== true) { aviso('Esta pantalla es solo para el equipo de Lana Rosa.'); return; }
    var rol = await sb.rpc('fn_rol_actual'); esAdmin = !rol.error && rol.data === 'administrador';
    $('#aviso').hidden = true; $('#app').hidden = false; $('#nuevo').hidden = !esAdmin;
    $('#publicar').onclick = async function () {
      var t = $('#texto').value.trim(); if (!t) return;
      $('#publicar').disabled = true; $('#error').hidden = true;
      var r = await sb.rpc('gestion_colab_publicar', { p_texto: t, p_destino: 'todos', p_fijada: $('#fijar').checked });
      $('#publicar').disabled = false;
      if (r.error) { $('#error').textContent = r.error.message; $('#error').hidden = false; return; }
      $('#texto').value = ''; $('#fijar').checked = false; cargar();
    };
    $('#lista').onclick = async function (e) {
      var art = e.target.closest('[data-id]'); if (!art) return;
      var id = art.dataset.id;
      if (e.target.dataset.borrar && confirm('¿Borrar este aviso del muro?')) { await sb.rpc('gestion_colab_borrar', { p_id: id }); cargar(); }
      else if (e.target.dataset.fijar) { await sb.rpc('gestion_colab_fijar', { p_id: id, p_fijada: e.target.dataset.fijar === 'true' }); cargar(); }
    };
    $('#onbAdmin').hidden = !esAdmin;
    $('#onbLista').onchange = async function (e) {
      var id = e.target.dataset.tarea; if (!id) return;
      var r = await sb.rpc('gestion_colab_onboarding_marcar', { p_tarea: id, p_hecha: e.target.checked });
      if (r.error) alert(r.error.message);
      cargarOnboarding();
    };
    $('#onbAsignar').onclick = async function () {
      var u = $('#onbPersona').value; if (!u) return;
      var r = await sb.rpc('gestion_colab_onboarding_asignar', { p_user: u });
      $('#onbMsg').textContent = r.error ? r.error.message : (r.data > 0 ? 'Listo: ' + r.data + ' tareas asignadas.' : 'Esa persona ya tenía sus tareas.');
      cargarOnboarding();
    };
    var verCump = esAdmin || rol.data === 'contador';
    $('#itemCump').hidden = !verCump;
    if (verCump) {
      $('#cumTodo').onchange = pintarCumplimiento;
      $('#cumLista').onclick = async function (e) {
        if (!e.target.dataset.guardar) return;
        var d = e.target.closest('[data-req]');
        var r = await sb.rpc('gestion_colab_requisito_set', { p_requisito: d.dataset.req, p_empleado: d.dataset.emp, p_estado: d.querySelector('[data-e]').value, p_vence: d.querySelector('[data-v]').value || null });
        if (r.error) alert(r.error.message); else cargarCumplimiento();
      };
      cargarCumplimiento();
    }
    document.addEventListener('click', function (e) { var b = e.target.closest('[data-ir],[data-atras]'); if (!b) return; if (b.dataset.ir) ir(b.dataset.ir); else volverLista(); });
    $('#orgAdmin').hidden = !esAdmin;
    $('#induccion').onclick = async function (e) {
      var slug = e.target.dataset.edit; if (!slug) return;
      var c = window.__cont.find(function (x) { return x.slug === slug; });
      var t = prompt(c.titulo + ' — escribe el texto:', c.texto); if (t === null) return;
      var r = await sb.rpc('gestion_colab_contenido_guardar', { p_slug: slug, p_titulo: c.titulo, p_texto: t, p_borrador: false });
      if (r.error) alert(r.error.message); else cargarInduccion();
    };
    $('#org').onclick = async function (e) { if (e.target.dataset.cerrar) { await sb.rpc('gestion_colab_vacante_cerrar', { p_id: e.target.dataset.cerrar }); cargarOrg(); } };
    $('#vacAgregar').onclick = async function () { var c = $('#vacCargo').value.trim(); if (!c) return; var r = await sb.rpc('gestion_colab_vacante_set', { p_cargo: c, p_area: $('#vacArea').value.trim() || null }); if (r.error) alert(r.error.message); else { $('#vacCargo').value = ''; cargarOrg(); } };
    $('#recEnviar').onclick = async function () {
      var m = $('#recMsg').value.trim(); if (!m || !$('#recPara').value) return; $('#recErr').hidden = true;
      var r = await sb.rpc('gestion_colab_reconocer', { p_para: $('#recPara').value, p_valor: $('#recValor').value, p_mensaje: m });
      if (r.error) { $('#recErr').textContent = r.error.message; $('#recErr').hidden = false; return; }
      $('#recMsg').value = ''; cargarRec();
    };
    prepararFicha(); cargarInduccion(); cargarOrg(); prepararRec();
    cargarOnboarding();
    cargar();
  }
  iniciar();
})();
</script>
</body>
</html>
